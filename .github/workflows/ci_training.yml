name: CI - Titanic MLProject Training

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      n_estimators:
        description: 'Jumlah estimator'
        required: false
        default: '100'
      max_depth:
        description: 'Kedalaman maksimum'
        required: false
        default: '6'

jobs:
  train:
    name: Train Titanic Model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn mlflow matplotlib seaborn

      - name: Run MLflow Project Training
        run: |
          cd MLProject
          mlflow run . \
            -P n_estimators=${{ github.event.inputs.n_estimators || '100' }} \
            -P max_depth=${{ github.event.inputs.max_depth || '6' }} \
            -P min_samples_split=2 \
            -P max_features=sqrt \
            -P test_size=0.2 \
            -P random_state=42 \
            --env-manager=local

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: titanic-model-artifacts-${{ github.run_number }}
          path: MLProject/mlruns/
          retention-days: 30

      - name: Save Artifacts to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p saved_artifacts/run-${{ github.run_number }}
          cp -r MLProject/mlruns saved_artifacts/run-${{ github.run_number }}/ 2>/dev/null || true
          echo "Run: ${{ github.run_number }}" > saved_artifacts/run-${{ github.run_number }}/run_info.txt
          echo "Timestamp: $(date -u)" >> saved_artifacts/run-${{ github.run_number }}/run_info.txt
          git add saved_artifacts/
          git diff --staged --quiet || git commit -m "ci: save artifacts run #${{ github.run_number }} [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
